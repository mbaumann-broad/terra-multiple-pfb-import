[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-import-prototype"
version = "0.1.0"
description = "Import a pre-signed Gen3 BioData Catalyst PFB export into Terra and verify the result"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2",
    "requests>=2.31",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
terra-import-prototype = "terra-import-prototype.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
